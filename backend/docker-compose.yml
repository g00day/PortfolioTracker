services:
  postgres-db:
    image: postgres:16-alpine
    container_name: portfolio_tracker_db
    environment:
      POSTGRES_USER: tracker_user
      POSTGRES_PASSWORD: tracker_secure_password
      POSTGRES_DB: portfolio_tracker
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - tracker-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker_user -d portfolio_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio_tracker_api
    ports:
      - "8080:8080"
    environment:
      APP_PORT: "8080"
      DEMO_SEED: "true"
      JWT_SECRET: "your_secure_hmac_cryptographic_key_phrase"
      PURPOSE_JWT_SECRET: "your_secure_password_reset_hmac_key_phrase"
      POSTGRES_USER_NAME: "tracker_user"
      POSTGRES_PASSWORD: "tracker_secure_password"
      POSTGRES_DB_NAME: "portfolio_tracker"
      POSTGRES_HOST: "postgres-db"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - tracker-network
    restart: unless-stopped

volumes:
  pgdata:

networks:
  tracker-network:
    driver: bridge
