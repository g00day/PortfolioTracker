version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: portfolio_tracker_db
    environment:
      POSTGRES_USER: tracker_user
      POSTGRES_PASSWORD: tracker_secure_password
      POSTGRES_DB: portfolio_tracker
    ports:
      - "5433:5433"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - tracker-network
    restart: unless-stopped

  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio_tracker_api
    ports:
      - "8080:8080"
    environment:
      DB_URL: "postgres://tracker_user:tracker_secure_password@postgres-db:5432/portfolio_tracker?sslmode=disable"
      APP_PORT: "8080"
      JWT_SECRET: "your_secure_hmac_cryptographic_key_phrase"
      GOCACHE: "/go-cache"
    volumes:
      - .:/app 
      - go_cache:/go-cache 
    depends_on:
      - postgres-db
    networks:
      - tracker-network
    restart: always

volumes:
  pgdata:
  go_cache:

networks:
  tracker-network:
    driver: bridge
