name: portfolio-tracker

services:
  postgres-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracker_user
      POSTGRES_PASSWORD: tracker_secure_password
      POSTGRES_DB: portfolio_tracker
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker_user -d portfolio_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_PORT: "8080"
      DEMO_SEED: "true"
      JWT_SECRET: "${JWT_SECRET:-local_development_jwt_secret_change_in_production}"
      PURPOSE_JWT_SECRET: "${PURPOSE_JWT_SECRET:-local_development_reset_secret_change_in_production}"
      POSTGRES_USER_NAME: tracker_user
      POSTGRES_PASSWORD: tracker_secure_password
      POSTGRES_DB_NAME: portfolio_tracker
      POSTGRES_HOST: postgres-db
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}"
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
